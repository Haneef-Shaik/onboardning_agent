[project]
name = "onb-mcp-mongo"
version = "0.1.0"
description = "MCP server for MongoDB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.20,<2",
    "onb-data",
    "onb-telemetry",
    "pydantic>=2.9,<3",
    "pyjwt>=2.10,<3",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onb_mcp_mongo"]

[tool.uv.sources]
onb-data = { workspace = true }
onb-telemetry = { workspace = true }
