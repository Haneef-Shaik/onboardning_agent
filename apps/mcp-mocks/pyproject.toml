[project]
name = "onb-mcp-mocks"
version = "0.1.0"
description = "Mock MCP server (Bitbucket, IT provisioning) and the Telegram transport stub"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.20,<2",
    "onb-mcp-mongo",
    "onb-telemetry",
    "opentelemetry-api>=1.45,<2",
    "pydantic>=2.9,<3",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onb_mcp_mocks"]

[tool.uv.sources]
onb-mcp-mongo = { workspace = true }
onb-telemetry = { workspace = true }
