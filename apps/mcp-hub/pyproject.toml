[project]
name = "onb-mcp-hub"
version = "0.1.0"
description = "MCP hub (tool gateway)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.20",
    "mcp>=1.20,<2",
    "onb-agents",
    "onb-crypto",
    "onb-data",
    "onb-guardrails",
    "onb-mcp-mocks",
    "onb-mcp-mongo",
    "onb-telemetry",
    "opentelemetry-api>=1.45,<2",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onb_mcp_hub"]

[tool.uv.sources]
onb-agents = { workspace = true }
onb-crypto = { workspace = true }
onb-data = { workspace = true }
onb-guardrails = { workspace = true }
onb-mcp-mocks = { workspace = true }
onb-mcp-mongo = { workspace = true }
onb-telemetry = { workspace = true }
