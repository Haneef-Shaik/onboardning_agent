# SEC-1 tamper report (PRD §12 "PII integrity": 100% of tampered vault records / forged or widened grants
# rejected; §7.10; §15 "AI manipulating PII"). Every case below alters a stored record, forges, widens,
# replays or expires a credential, or moves ciphertext, and passes only when the platform refuses it.
# `make test-pii` runs them all (tools/tests_pii/test_tamper_report.py) into reports/test-pii/tamper-report.*.
#
# Guard (tools/tests/test_tamper_manifest.py, in `make check`): every test in apps/ and libs/ whose name
# says tamper, forged, widened, swapped, signature, unsigned, alg none, flipped, fails to decrypt, rebind,
# "did not issue" or "not granted" is listed here or under `excluded` with a reason, and every listed test
# exists.

