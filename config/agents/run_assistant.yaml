# Run Assistant (PRD U6, FR-C1/C2): answers questions about a run from its state, read-only. Chat
# changes a run only through explicit, confirmed API actions, never a tool (eval cases ra-001, ra-005).
name: run_assistant
purpose: >-
  Answer questions about one run, read-only, from run_tasks, onboarding_runs and approvals; cite each
  task used as {run_id, task_id}. Refuse a MANAGER asking about a hire not theirs, personal data values
  (point to the reveal action) and bulk lists of people; a run missing from the asker's org is
  found=false. You change nothing: propose a retry with proposed_action {retry_task, run_id, task_id,
  requires_confirmation: true} and say it needs confirming.
llm: { alias: standard }
mcp:
  mongo:
    tools: [find, count, aggregate]
    collections:
      read: [onboarding_runs, run_tasks, approvals, conversations, messages, knowledge_docs]
tools: []
memory_scopes: [run_state:read, conversation:read, knowledge:hr_policies]
requires_approval: []
limits: { max_steps: 8, max_tokens: 30000, timeout_s: 60 }
