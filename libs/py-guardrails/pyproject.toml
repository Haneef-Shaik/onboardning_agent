[project]
name = "onb-guardrails"
version = "0.1.0"
description = "Guardrail layer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain-core>=1.0,<2",
  "onb-data",
  "opentelemetry-api>=1.45,<2",
  "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onb_guardrails"]

[tool.uv.sources]
onb-data = { workspace = true }
