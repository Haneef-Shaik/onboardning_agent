[project]
name = "onb-data"
version = "0.1.0"
description = "Tenant repositories"
requires-python = ">=3.12,<3.13"
dependencies = ["opentelemetry-api>=1.45,<2", "pymongo>=4.10,<5"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onb_data"]
