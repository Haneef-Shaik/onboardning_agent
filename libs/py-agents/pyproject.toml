[project]
name = "onb-agents"
version = "0.1.0"
description = "Agent graphs and the agent registry"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain-core>=1.0,<2",
  "langchain-mcp-adapters>=0.1,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.20,<2",
  "onb-contracts",
  "onb-crypto",
  "onb-data",
  "onb-eventbus",
  "onb-guardrails",
  "onb-llm",
  "onb-telemetry",
  "opentelemetry-api>=1.45,<2",
  "pydantic>=2.9,<3",
  "pyjwt>=2.10,<3",
  "pymongo>=4.10,<5",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onb_agents"]

[tool.uv.sources]
onb-contracts = { workspace = true }
onb-crypto = { workspace = true }
onb-data = { workspace = true }
onb-eventbus = { workspace = true }
onb-guardrails = { workspace = true }
onb-llm = { workspace = true }
onb-telemetry = { workspace = true }
