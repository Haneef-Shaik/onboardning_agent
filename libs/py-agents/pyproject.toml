[project]
name = "onb-agents"
version = "0.1.0"
description = "Agent graphs and the agent registry"
requires-python = ">=3.12,<3.13"
dependencies = [
  "onb-contracts",
  "onb-crypto",
  "onb-data",
  "onb-guardrails",
  "onb-llm",
  "pydantic>=2.9,<3",
  "pyjwt>=2.10,<3",
  "pymongo>=4.10,<5",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onb_agents"]

[tool.uv.sources]
onb-contracts = { workspace = true }
onb-crypto = { workspace = true }
onb-data = { workspace = true }
onb-guardrails = { workspace = true }
onb-llm = { workspace = true }
