[project]
name = "onb-eventbus"
version = "0.1.0"
description = "MongoDB event bus"
requires-python = ">=3.12,<3.13"
dependencies = [
  "onb-data",
  "onb-telemetry",
  "opentelemetry-api>=1.45,<2",
  "pymongo>=4.10,<5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onb_eventbus"]
