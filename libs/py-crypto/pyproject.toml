[project]
name = "onb-crypto"
version = "0.1.0"
description = "PII vault crypto"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=46,<47",
    "onb-data",
    "pymongo>=4.10,<5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onb_crypto"]

[tool.uv.sources]
onb-data = { workspace = true }
